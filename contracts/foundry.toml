[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../third_party/rwa-index/contracts/lib"]
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../deployments/" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
rh_testnet = "${RH_TESTNET_RPC}"
